<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>貓貓冊店</title>
  <meta name="description" content="這裡不賣書,只提供看見價值的入場券。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Iansui&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap home">
    <h1>貓貓冊店</h1>
    <p class="tailo" lang="nan-Latn-TL">niau-niau tsheh-tiàm</p>
    <p class="tagline">這裡不賣書,只提供看見價值的入場券</p>

    <section class="stage" aria-label="兔子與貓">
      <!-- 兔子 -->
      <div class="char rabbit">
        <div class="bubble" id="bubble-rabbit">
          <p>想去哪裡逛逛?</p>
          <div class="btns">
            <a class="btn" href="https://cat2758rabbit8964.github.io/taiwan-chronicle/game.html" target="_blank" rel="noopener">尋找上輩子的樣子 <span class="ext">↗</span></a>
            <a class="btn" href="https://cat2758rabbit8964.github.io/taiwan-candidate-map/" target="_blank" rel="noopener">找適合您的候選人 <span class="ext">↗</span></a>
          </div>
        </div>
        <button class="char-btn" type="button" aria-expanded="false" aria-controls="bubble-rabbit" aria-label="兔子:展開連結">
          <img src="img/rabbit.png" alt="一隻害羞的兔子" width="398" height="530">
        </button>
      </div>

      <!-- 貓 -->
      <div class="char cat">
        <div class="bubble" id="bubble-cat">
          <p>歡迎光臨。</p>
          <div class="btns">
            <a class="btn" href="books.html">書籍介紹</a>
            <a class="btn" href="columns.html">專欄文章</a>
          </div>
        </div>
        <button class="char-btn" type="button" aria-expanded="false" aria-controls="bubble-cat" aria-label="貓:展開選單">
          <img src="img/cat.png" alt="一隻圓臉的貓" width="400" height="430">
        </button>
      </div>
    </section>

    <p class="hint">
      <span class="mouse">把滑鼠移到牠們身上看看</span>
      <span class="touch">點一下牠們看看</span>
    </p>
  </main>

  <footer class="foot">貓貓冊店 niau-niau tsheh-tiàm<span class="addr">地址:某科技公司科技大樓二樓一隅</span></footer>
  <script src="js/main.js"></script>
</body>
</html>
