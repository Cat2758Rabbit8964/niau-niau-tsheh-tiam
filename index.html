<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>貓貓冊店</title>
  <meta name="description" content="這裡不賣書,只提供看見價值的入場券。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Iansui&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">
  <main class="wrap home">
    <h1>貓貓冊店</h1>
    <p class="tailo" lang="nan-Latn-TL">niau-niau tsheh-tiàm</p>
    <p class="tagline">這裡不賣書,只提供看見價值的入場券</p>

    <section class="stage" aria-label="兔子與貓">
      <!-- 兔子 -->
      <div class="char rabbit">
        <div class="bubble" id="bubble-rabbit">
          <p>想去哪裡逛逛?</p>
          <div class="btns">
            <a class="btn" href="past-life.html">找尋您的前世</a>
            <a class="btn" href="candidates.html">「九合一」找到契合您的候選人</a>
          </div>
        </div>
        <button class="char-btn" type="button" aria-expanded="false" aria-controls="bubble-rabbit" aria-label="兔子:展開連結">
          <img src="img/rabbit.png" alt="一隻害羞的兔子" width="398" height="530">
        </button>
      </div>

      <!-- 貓 -->
      <div class="char cat">
        <div class="bubble" id="bubble-cat">
          <p>歡迎光臨。</p>
          <div class="btns">
            <a class="btn" href="books.html">書籍介紹</a>
            <a class="btn" href="columns.html">專欄文章</a>
            <a class="btn" href="rules.html">書店使用規約</a>
            <a class="btn" href="manager.html">店長的話</a>
          </div>
        </div>
        <button class="char-btn" type="button" aria-expanded="false" aria-controls="bubble-cat" aria-label="貓:展開選單">
          <img src="img/cat.png" alt="一隻圓臉的貓" width="400" height="430">
        </button>
        <svg class="counter" viewBox="0 -44 360 142" aria-hidden="true" focusable="false">
          <defs>
            <filter id="wobble" x="-3%" y="-6%" width="106%" height="112%">
              <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="9" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
            </filter>
          </defs>
          <g class="cl" filter="url(#wobble)">
            <!-- 左端:一疊書 -->
            <rect x="22" y="-10" width="66" height="14"/><line x1="30" y1="-3" x2="80" y2="-3"/>
            <rect x="28" y="-22" width="54" height="12"/><line x1="36" y1="-16" x2="74" y2="-16"/>
            <rect x="24" y="-34" width="58" height="12"/><line x1="32" y1="-28" x2="74" y2="-28"/>
            <!-- 右端:服務鈴 -->
            <ellipse cx="324" cy="1" rx="24" ry="4"/>
            <path d="M306 0 a18 18 0 0 1 36 0"/>
            <circle cx="324" cy="-21" r="3"/>
            <!-- 檯面與櫃身 -->
            <rect class="slab" x="4" y="4" width="352" height="14" rx="4"/>
            <rect class="body" x="16" y="18" width="328" height="74"/>
            <rect x="28" y="30" width="92" height="52" rx="4"/>
            <rect x="134" y="30" width="92" height="52" rx="4"/>
            <rect x="240" y="30" width="92" height="52" rx="4"/>
            <circle cx="108" cy="56" r="3"/><circle cx="214" cy="56" r="3"/><circle cx="320" cy="56" r="3"/>
            <line x1="10" y1="92" x2="350" y2="92"/>
          </g>
        </svg>
      </div>
    </section>

    <p class="hint">
      <span class="mouse">把滑鼠移到牠們身上看看</span>
      <span class="touch">點一下牠們看看</span>
    </p>
  </main>

  <footer class="foot">貓貓冊店 niau-niau tsheh-tiàm<span class="addr"><span class="nw">營業時間:每週一至週五 9:00–18:00</span> <span class="nw">(不定期休假或延長營業)</span></span><span class="addr">地址:某科技公司科技大樓二樓一隅</span></footer>
  <script src="js/main.js"></script>
</body>
</html>
